<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Math Tower Race 🔥</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800;900&display=swap');

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

:root{
  --fire:#ff4500;
  --gold:#ffd700;
  --deep:#0d0820;
  --card:rgba(255,255,255,0.07);
  --border:rgba(255,255,255,0.12);
}

body{
  font-family:'Nunito',sans-serif;
  background:var(--deep);
  color:#fff;
  min-height:100vh;
  overflow-x:hidden;
}

/* ── SCREENS ── */
.screen{display:none;width:100%;min-height:100vh;flex-direction:column;align-items:center;}
.screen.active{display:flex;}

/* ── LOBBY ── */
#lobbyScreen{
  background:radial-gradient(ellipse at 50% 0%,#3d0f0f 0%,#0d0820 60%);
  padding:1.5rem 1rem 2rem;
  gap:1.2rem;
  justify-content:center;
}

.logo{
  font-family:'Fredoka One',cursive;
  font-size:2.6rem;
  line-height:1;
  text-align:center;
  color:var(--gold);
  text-shadow:0 0 40px #ff6600,0 4px 0 #cc3300;
}
.logo-sub{font-size:.85rem;color:#ff9966;text-align:center;margin-top:.3rem;}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:1.2rem 1rem;
  width:100%;
  max-width:420px;
}

.card-title{
  font-family:'Fredoka One',cursive;
  font-size:1rem;
  color:#aaa;
  text-transform:uppercase;
  letter-spacing:1.5px;
  margin-bottom:.8rem;
  text-align:center;
}

input[type=text]{
  width:100%;
  padding:.7rem 1rem;
  border-radius:12px;
  border:2px solid var(--border);
  background:rgba(255,255,255,0.08);
  color:#fff;
  font-family:'Nunito',sans-serif;
  font-size:1rem;
  font-weight:700;
  outline:none;
  margin-bottom:.6rem;
  text-align:center;
  letter-spacing:1px;
}
input[type=text]:focus{border-color:var(--gold);background:rgba(255,215,0,.08);}
input[type=text]::placeholder{color:#666;font-weight:400;}

.char-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:6px;
  margin-bottom:.5rem;
}
.char-opt{
  aspect-ratio:1;
  border-radius:10px;
  border:2px solid transparent;
  background:rgba(255,255,255,.06);
  cursor:pointer;
  font-size:1.4rem;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.char-opt:hover{background:rgba(255,255,255,.14);transform:scale(1.08);}
.char-opt.sel{border-color:var(--gold);background:rgba(255,215,0,.15);box-shadow:0 0 10px rgba(255,215,0,.3);}

.btn{
  font-family:'Fredoka One',cursive;
  font-size:1.15rem;
  padding:.75rem 2rem;
  border:none;
  border-radius:50px;
  cursor:pointer;
  transition:all .18s;
  display:inline-flex;align-items:center;gap:.4rem;
  width:100%;
  justify-content:center;
}
.btn:hover{transform:translateY(-2px) scale(1.03);}
.btn:active{transform:scale(.97);}

.btn-fire{
  background:linear-gradient(135deg,#ff6600,#ff3300);
  color:#fff;
  box-shadow:0 5px 0 #991100,0 7px 20px rgba(255,80,0,.4);
  margin-top:.4rem;
}
.btn-outline{
  background:transparent;
  color:#aaa;
  border:2px solid rgba(255,255,255,.15);
  font-size:.9rem;
  padding:.55rem 1.5rem;
  margin-top:.3rem;
}
.btn-outline:hover{border-color:rgba(255,255,255,.3);color:#fff;}

.room-code-display{
  font-family:'Fredoka One',cursive;
  font-size:3rem;
  text-align:center;
  color:var(--gold);
  letter-spacing:.5rem;
  text-shadow:0 0 20px rgba(255,215,0,.4);
  padding:.5rem 0;
  border:2px dashed rgba(255,215,0,.3);
  border-radius:14px;
  margin:.5rem 0;
}

.waiting-dots span{animation:dot 1.4s infinite;}
.waiting-dots span:nth-child(2){animation-delay:.2s;}
.waiting-dots span:nth-child(3){animation-delay:.4s;}
@keyframes dot{0%,80%,100%{opacity:.2;}40%{opacity:1;}}

.players-waiting{
  display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;
  margin-top:.5rem;
}
.player-pill{
  display:flex;align-items:center;gap:.4rem;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  border-radius:30px;
  padding:.3rem .8rem;
  font-size:.85rem;font-weight:700;
}
.player-pill.ready{border-color:#00cc66;background:rgba(0,200,100,.1);}

/* ── GAME SCREEN ── */
#gameScreen{
  background:var(--deep);
  padding:0;
  overflow:hidden;
  position:relative;
}

.game-wrap{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* HUD */
.hud{
  display:flex;
  align-items:center;
  padding:.5rem .8rem;
  background:rgba(0,0,0,.6);
  border-bottom:2px solid rgba(255,80,0,.35);
  flex-shrink:0;
  gap:.5rem;
}
.hud-player{display:flex;align-items:center;gap:6px;flex:1;}
.hud-player.right{flex-direction:row-reverse;justify-content:flex-end;}
.hud-avatar{font-size:1.6rem;}
.hud-name{font-weight:900;font-size:.78rem;white-space:nowrap;}
.hud-h{font-size:.65rem;color:#aaa;}
.hud-center{
  font-family:'Fredoka One',cursive;
  font-size:.8rem;color:#fff;
  background:rgba(255,80,0,.35);
  padding:.2rem .7rem;border-radius:20px;
  text-align:center;white-space:nowrap;
  border:1px solid rgba(255,130,0,.4);
}

/* TOWERS AREA */
.towers-area{
  flex:1;display:flex;position:relative;overflow:hidden;
}
.tcol{
  flex:1;position:relative;
  border-right:1px solid rgba(255,255,255,.04);
  overflow:hidden;
}
.tcol:last-child{border-right:none;}

.sky{
  position:absolute;inset:0;
  background:linear-gradient(180deg,#07031a 0%,#150a38 45%,#3d0f0f 80%,#660e00 100%);
}
.star{
  position:absolute;width:2px;height:2px;
  background:#fff;border-radius:50%;
  animation:twinkle 2s infinite alternate;
}
@keyframes twinkle{from{opacity:.2;}to{opacity:1;}}

/* tower & character */
.tower-vis{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;
  transition:bottom .6s cubic-bezier(.25,.46,.45,.94);
  z-index:5;width:64px;
}
.char-emoji{
  font-size:2rem;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.9));
  animation:bob 1.2s ease-in-out infinite alternate;
}
@keyframes bob{from{transform:translateY(0);}to{transform:translateY(-5px);}}
.tower-stack{display:flex;flex-direction:column;align-items:center;gap:0;}
.tblock{width:54px;height:16px;border-radius:3px;border:1px solid rgba(255,255,255,.18);margin-bottom:1px;}

/* LAVA */
.lava-col{
  position:absolute;bottom:0;left:0;right:0;z-index:3;
  transition:height .8s ease-in-out;
  background:linear-gradient(180deg,rgba(255,80,0,0) 0%,#ff4500 25%,#dd2200 100%);
}
.lava-surf{
  position:absolute;top:0;left:0;right:0;height:22px;
  background:linear-gradient(90deg,#ff6600,#ff4400,#ff8800,#ff3300,#ff6600);
  background-size:200% 100%;
  animation:lflow 2.5s linear infinite;
  border-radius:60% 60% 0 0/30px 30px 0 0;
}
@keyframes lflow{from{background-position:0%}to{background-position:200%}}
.lava-warn{
  position:absolute;top:-28px;left:0;right:0;
  text-align:center;font-size:.65rem;font-weight:900;color:#ff6600;
  animation:blink .4s infinite alternate;z-index:10;display:none;
}
@keyframes blink{from{opacity:0;}to{opacity:1;}}

/* answered overlay per column */
.col-status{
  position:absolute;top:8px;left:0;right:0;
  text-align:center;font-size:1.5rem;z-index:8;
  display:none;
}

/* QUESTION PANEL */
.qpanel{
  flex-shrink:0;
  background:rgba(8,4,22,.97);
  border-top:3px solid var(--fire);
  padding:.9rem 1rem;
}
.qmeta{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:.5rem;
}
.qlvl{
  font-family:'Fredoka One',cursive;
  font-size:.72rem;padding:.18rem .65rem;border-radius:20px;font-weight:700;
}
.lvl-e{background:rgba(0,200,100,.15);color:#00dd77;border:1px solid #00cc66;}
.lvl-m{background:rgba(255,150,0,.15);color:#ffbb00;border:1px solid #ffaa00;}
.lvl-h{background:rgba(255,50,50,.15);color:#ff5555;border:1px solid #ff4444;}

.qcounter{font-size:.72rem;color:#666;}
.qtext{
  font-family:'Fredoka One',cursive;
  font-size:1.45rem;text-align:center;color:#fff;
  margin-bottom:.7rem;
  text-shadow:0 1px 12px rgba(255,255,255,.25);
}
.ans-grid{display:grid;grid-template-columns:1fr 1fr;gap:.45rem;}
.abtn{
  font-family:'Fredoka One',cursive;
  font-size:1.05rem;
  padding:.65rem .5rem;
  border-radius:13px;
  border:2px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.06);
  color:#fff;cursor:pointer;
  transition:all .14s;text-align:center;
}
.abtn:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.28);transform:scale(1.02);}
.abtn.correct{background:rgba(0,200,100,.25);border-color:#00cc66;animation:pop .45s ease;}
.abtn.wrong{background:rgba(255,50,50,.25);border-color:#ff4444;animation:shk .38s ease;}
.abtn:disabled{cursor:default;}
@keyframes pop{0%{transform:scale(1);}50%{transform:scale(1.08);}100%{transform:scale(1);}}
@keyframes shk{0%,100%{transform:translateX(0);}25%{transform:translateX(-7px);}75%{transform:translateX(7px);}}

/* status bar while waiting for others */
.wait-banner{
  font-family:'Fredoka One',cursive;
  font-size:1rem;text-align:center;
  color:var(--gold);padding:.5rem;
  animation:pulse 1s infinite alternate;
}
@keyframes pulse{from{opacity:.6;}to{opacity:1;}}

/* RESULT POPUP */
.rpop{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(0);
  background:rgba(8,4,22,.97);
  border-radius:22px;padding:1.3rem 1.8rem;
  text-align:center;z-index:100;
  border:3px solid transparent;
  transition:transform .25s cubic-bezier(.25,.46,.45,.94);
  pointer-events:none;min-width:180px;
}
.rpop.show{transform:translate(-50%,-50%) scale(1);}
.rpop.win{border-color:var(--gold);box-shadow:0 0 40px rgba(255,215,0,.35);}
.rpop.lose{border-color:#ff4444;box-shadow:0 0 40px rgba(255,0,0,.3);}
.rpop-em{font-size:2.5rem;}
.rpop-txt{font-family:'Fredoka One',cursive;font-size:1.1rem;color:var(--gold);margin-top:.3rem;}

/* END SCREEN */
#endScreen{
  background:radial-gradient(ellipse at 50% 0%,#1a3a1a 0%,#0d0820 60%);
  padding:2rem 1rem;gap:1.2rem;justify-content:center;
}
.winner-box{
  background:rgba(255,215,0,.08);
  border:2px solid var(--gold);
  border-radius:22px;padding:1.3rem 2rem;text-align:center;
  width:100%;max-width:380px;
}
.winner-em{font-size:3.5rem;}
.winner-lbl{font-size:.75rem;color:#aaa;text-transform:uppercase;letter-spacing:2px;margin-top:.3rem;}
.winner-name{font-family:'Fredoka One',cursive;font-size:2.2rem;text-shadow:0 0 20px rgba(255,215,0,.5);}

.stats-row{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center;width:100%;max-width:380px;}
.sbox{
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  border-radius:14px;padding:.7rem 1rem;flex:1;min-width:90px;text-align:center;
}
.sbox-lbl{font-size:.65rem;color:#777;text-transform:uppercase;letter-spacing:1px;}
.sbox-val{font-family:'Fredoka One',cursive;font-size:1.35rem;color:var(--gold);}

.hbar-wrap{width:100%;max-width:380px;background:rgba(255,255,255,.06);border-radius:12px;padding:.8rem;}
.hbar-row{display:flex;align-items:center;gap:8px;margin-bottom:.4rem;}
.hbar-row:last-child{margin-bottom:0;}
.hbar-track{flex:1;height:18px;background:rgba(255,255,255,.08);border-radius:9px;overflow:hidden;}
.hbar-fill{height:100%;border-radius:9px;transition:width .6s ease;}
.hbar-num{font-family:'Fredoka One',cursive;font-size:.8rem;color:var(--gold);min-width:44px;text-align:right;}

/* confetti */
.cf{
  position:fixed;width:9px;height:9px;top:-20px;
  animation:cfall linear forwards;border-radius:2px;
  pointer-events:none;z-index:200;
}
@keyframes cfall{to{transform:translateY(110vh) rotate(720deg);opacity:0;}}

/* misc */
.sep{width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,80,0,.4),transparent);margin:.2rem 0;}
.txt-center{text-align:center;}
.color-gold{color:var(--gold);}
.color-muted{color:#888;}
.mt-sm{margin-top:.4rem;}
</style>
</head>

<!-- ═══════════ LOBBY ═══════════ -->
<div id="lobbyScreen" class="screen active">
  <div class="logo">🏰🔥<br>MATH TOWER RACE</div>
  <div class="logo-sub">Multiplayer · Quantitative Reasoning</div>

  <!-- STEP 1: Pilih nama & karakter -->
  <div class="card" id="profileCard">
    <div class="card-title">👤 Profil Kamu</div>
    <input type="text" id="nameInput" placeholder="Nama kamu..." maxlength="16">
    <div class="char-grid" id="charGrid"></div>
  </div>

  <!-- STEP 2: Buat atau gabung room -->
  <div class="card" id="roomCard">
    <div class="card-title">🚪 Pilih Mode</div>
    <button class="btn btn-fire" onclick="createRoom()">✨ Buat Room Baru</button>
    <div style="text-align:center;color:#555;font-size:.8rem;margin:.5rem 0;">— atau —</div>
    <input type="text" id="roomCodeInput" placeholder="Kode room (4 huruf)..." maxlength="4" style="text-transform:uppercase;letter-spacing:3px;">
    <button class="btn btn-fire" onclick="joinRoom()">🔗 Gabung Room</button>
  </div>

  <!-- Waiting Room -->
  <div class="card" id="waitingCard" style="display:none;">
    <div class="card-title">⏳ Menunggu Pemain</div>
    <div class="room-code-display" id="displayCode">----</div>
    <div class="txt-center color-muted" style="font-size:.8rem;">Bagikan kode ini ke temanmu!</div>
    <div class="sep"></div>
    <div class="players-waiting" id="playersWaiting"></div>
    <div class="txt-center mt-sm" style="font-size:.8rem;color:#666;">
      <span class="waiting-dots">Menunggu pemain lain<span>.</span><span>.</span><span>.</span></span>
    </div>
    <button class="btn btn-fire" id="startBtn" style="display:none;margin-top:.6rem;" onclick="hostStartGame()">🔥 Mulai Battle!</button>
    <button class="btn btn-outline" onclick="leaveRoom()">← Keluar</button>
  </div>

  <div id="lobbyMsg" class="txt-center" style="font-size:.85rem;color:#ff9966;min-height:1.2rem;"></div>
</div>

<!-- ═══════════ GAME ═══════════ -->
<div id="gameScreen" class="screen">
  <div class="game-wrap">
    <div class="hud" id="gameHud"></div>
    <div class="towers-area" id="towersArea"></div>
    <div class="qpanel" id="qpanel"></div>
  </div>
</div>

<!-- ═══════════ END ═══════════ -->
<div id="endScreen" class="screen">
  <div style="font-size:2.5rem;">🏆</div>
  <div class="winner-box" id="winnerBox"></div>
  <div class="stats-row" id="statsRow"></div>
  <div class="hbar-wrap" id="hbarWrap"></div>
  <div style="display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;width:100%;max-width:380px;">
    <button class="btn btn-fire" onclick="goLobby()">🏠 Kembali ke Lobby</button>
  </div>
</div>

<div class="rpop" id="rpop">
  <div class="rpop-em" id="rpopEm"></div>
  <div class="rpop-txt" id="rpopTxt"></div>
</div>

    {q:'3 × 180 + 1,25 × 240 = …',o:['540','840','780','810'],a:1},
    {q:'1/4 × 480 + 6 × 55 = …',o:['450','120','390','420'],a:0},
    {q:'0,5 × 560 + 7 × 40 = …',o:['280','520','600','560'],a:3},
    {q:'2,5 × 120 + 5 × 54 = …',o:['300','540','570','600'],a:2},
    {q:'3/5 × 450 + 9 × 25 = …',o:['495','270','465','520'],a:0},
    {q:'1,5 × 320 + 4 × 75 = …',o:['480','740','780','810'],a:2},
  ]
};

// Poin & lava per level
// [poin_cepat(<5s), poin_medium(<15s), poin_lambat]
const PTS = {1:[80,50,30], 2:[120,80,50], 3:[180,120,80]};
// Lava naik per soal selesai (semua jawab), per level
const LAVA_RISE = {1:6, 2:10, 3:16};
const LVL_NAME = {1:'Easy',2:'Medium',3:'Hard'};

/* ─── STATE ────────────────────────────────────────────────────── */
let myId = null;
let myName = '';
let myChar = 0;
let roomId = null;
let isHost = false;
let roomRef = null;
let listeners = [];

let localState = {
  players: {},   // uid -> {name,char,color,height,correct,wrong}
  qIdx: 0,
  qList: [],     // [{level,q,o,a}, ...]
  lava: 0,
  phase: 'waiting', // waiting | question | end
  roundAnswers: {}, // uid -> {correct,pts,elapsed}
};

/* ─── INIT ─────────────────────────────────────────────────────── */
window.onload = () => {
  buildCharGrid();
  myId = 'u' + Math.random().toString(36).slice(2,10);
};

function buildCharGrid() {
  const g = document.getElementById('charGrid');
  CHARS.forEach((c,i) => {
    const d = document.createElement('div');
    d.className = 'char-opt' + (i===0?' sel':'');
    d.textContent = c;
    d.onclick = () => {
      g.querySelectorAll('.char-opt').forEach(x=>x.classList.remove('sel'));
      d.classList.add('sel');
      myChar = i;
    };
    g.appendChild(d);
  });
}

function setMsg(m){ document.getElementById('lobbyMsg').textContent = m; }

/* ─── ROOM MANAGEMENT ──────────────────────────────────────────── */
function genCode(){ return Math.random().toString(36).slice(2,6).toUpperCase(); }

async function createRoom(){
  const name = document.getElementById('nameInput').value.trim() || 'Pemain';
  myName = name;
  const code = genCode();
  roomId = code;
  isHost = true;

  roomRef = db.ref('rooms/'+code);
  await roomRef.set({
    host: myId,
    status: 'waiting',
    players: {},
    game: null,
    created: Date.now()
  });

  await joinRoomData(code, name);
  showWaiting(code);
}

async function joinRoom(){
  const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
  if(code.length < 4){ setMsg('⚠️ Kode room harus 4 karakter'); return; }
  const name = document.getElementById('nameInput').value.trim() || 'Pemain';
  myName = name;
  roomId = code;
  isHost = false;

  const snap = await db.ref('rooms/'+code).once('value');
  if(!snap.exists()){ setMsg('❌ Room tidak ditemukan'); return; }
  if(snap.val().status !== 'waiting'){ setMsg('❌ Game sudah dimulai'); return; }

  roomRef = db.ref('rooms/'+code);
  await joinRoomData(code, name);
  showWaiting(code);
}

async function joinRoomData(code, name){
  const colorIdx = Object.keys((await db.ref('rooms/'+code+'/players').once('value')).val()||{}).length % 4;
  await db.ref('rooms/'+code+'/players/'+myId).set({
    name: name,
    char: myChar,
    color: COLORS[colorIdx],
    height: 0,
    correct: 0,
    wrong: 0,
    online: true
  });
  // remove on disconnect
  db.ref('rooms/'+code+'/players/'+myId+'/online').onDisconnect().set(false);
}

function showWaiting(code){
  document.getElementById('roomCard').style.display='none';
  document.getElementById('waitingCard').style.display='block';
  document.getElementById('profileCard').style.display='none';
  document.getElementById('displayCode').textContent = code;

  // listen players
  const pRef = db.ref('rooms/'+code+'/players');
  const pLis = pRef.on('value', snap => {
    const players = snap.val() || {};
    renderWaitingPlayers(players);
    if(isHost){
      const count = Object.values(players).filter(p=>p.online!==false).length;
      document.getElementById('startBtn').style.display = count>=2 ? 'block':'none';
    }
  });
  listeners.push({ref:pRef, fn:pLis, evt:'value'});

  // listen game start
  const gRef = db.ref('rooms/'+code+'/status');
  const gLis = gRef.on('value', snap => {
    if(snap.val() === 'playing') enterGame();
  });
  listeners.push({ref:gRef, fn:gLis, evt:'value'});
}

function renderWaitingPlayers(players){
  const div = document.getElementById('playersWaiting');
  div.innerHTML = Object.entries(players).map(([uid,p])=>`
    <div class="player-pill ${uid===myId?'ready':''}">
      <span>${CHARS[p.char||0]}</span>
      <span style="color:${p.color||'#fff'}">${p.name}</span>
      ${uid===myId?'<span style="font-size:.65rem;color:#00cc66">● Kamu</span>':''}
    </div>
  `).join('');
}

async function hostStartGame(){
  if(!isHost) return;
  // build question list
  const qList = buildQList();
  await roomRef.update({
    status:'playing',
    'game/qList': qList,
    'game/qIdx': 0,
    'game/lava': 0,
    'game/phase': 'question',
    'game/roundAnswers': null,
    'game/qStartTime': Date.now()
  });
}

function buildQList(){
  const shuffle = a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  const q1=shuffle([...QUESTIONS[1]]).slice(0,10).map(q=>({...q,level:1}));
  const q2=shuffle([...QUESTIONS[2]]).slice(0,10).map(q=>({...q,level:2}));
  const q3=shuffle([...QUESTIONS[3]]).slice(0,10).map(q=>({...q,level:3}));
  return [...q1,...q2,...q3];
}

function leaveRoom(){
  cleanupListeners();
  if(roomRef){
    db.ref('rooms/'+roomId+'/players/'+myId).remove();
  }
  roomId=null; roomRef=null; isHost=false;
  document.getElementById('waitingCard').style.display='none';
  document.getElementById('roomCard').style.display='block';
  document.getElementById('profileCard').style.display='block';
}

function cleanupListeners(){
  listeners.forEach(l=>l.ref.off(l.evt, l.fn));
  listeners=[];
}

/* ─── GAME ──────────────────────────────────────────────────────── */
let gameRef = null;
let myAnsweredThisRound = false;
let qStartTime = 0;

function enterGame(){
  cleanupListeners();
  setScreen('gameScreen');

  gameRef = db.ref('rooms/'+roomId+'/game');
  const pRef = db.ref('rooms/'+roomId+'/players');

  // Listen players (heights etc)
  const pLis = pRef.on('value', snap => {
    localState.players = snap.val() || {};
    updateTowers();
    updateHUD();
  });
  listeners.push({ref:pRef, fn:pLis, evt:'value'});

  // Listen game state
  const gLis = gameRef.on('value', snap => {
    const g = snap.val();
    if(!g) return;
    syncGameState(g);
  });
  listeners.push({ref:gameRef, fn:gLis, evt:'value'});
}

function syncGameState(g){
  const prevIdx = localState.qIdx;
  localState.qIdx = g.qIdx || 0;
  localState.qList = g.qList || [];
  localState.lava = g.lava || 0;
  localState.phase = g.phase || 'question';
  localState.roundAnswers = g.roundAnswers || {};
  qStartTime = g.qStartTime || Date.now();

  updateLava();

  if(g.phase === 'end'){
    showEndScreen(); return;
  }

  if(g.phase === 'question'){
    myAnsweredThisRound = !!localState.roundAnswers[myId];
    renderQuestion();
  }

  if(g.phase === 'reveal'){
    renderReveal();
  }
}

/* ─── RENDER TOWERS ─────────────────────────────────────────────── */
function buildTowersUI(){
  const area = document.getElementById('towersArea');
  area.innerHTML = '';
  const playerList = Object.entries(localState.players);
  playerList.forEach(([uid,p],i)=>{
    const col = document.createElement('div');
    col.className = 'tcol';
    col.id = 'tcol_'+uid;

    const sky = document.createElement('div');
    sky.className = 'sky';
    for(let s=0;s<15;s++){
      const st=document.createElement('div');
      st.className='star';
      st.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*65}%;animation-delay:${Math.random()*2}s`;
      sky.appendChild(st);
    }

    const tv = document.createElement('div');
    tv.className = 'tower-vis';
    tv.id = 'tv_'+uid;
    tv.style.bottom = '15%';
    tv.innerHTML = `<div class="char-emoji" style="animation-delay:${i*.3}s">${CHARS[p.char||0]}</div><div class="tower-stack" id="stk_'+uid+'"></div>`;
    // fix id inside innerHTML
    tv.querySelector('.tower-stack').id = 'stk_'+uid;

    const lava = document.createElement('div');
    lava.className = 'lava-col';
    lava.id = 'lava_'+uid;
    lava.style.height = '0%';
    lava.innerHTML = `<div class="lava-surf"></div><div class="lava-warn" id="warn_${uid}">⚠️ BAHAYA!</div>`;

    const status = document.createElement('div');
    status.className = 'col-status';
    status.id = 'cst_'+uid;

    col.appendChild(sky);
    col.appendChild(tv);
    col.appendChild(lava);
    col.appendChild(status);
    area.appendChild(col);
  });
}

let towersBuilt = false;
function updateTowers(){
  if(!towersBuilt){
    buildTowersUI();
    towersBuilt = true;
  }
  const playerList = Object.entries(localState.players);
  const maxH = Math.max(...playerList.map(([,p])=>p.height||0), 100);

  playerList.forEach(([uid,p])=>{
    const tv = document.getElementById('tv_'+uid);
    const stk = document.getElementById('stk_'+uid);
    if(!tv||!stk) return;
    const pct = 12 + ((p.height||0)/700)*78;
    tv.style.bottom = Math.min(pct,88)+'%';

    const nb = Math.min(Math.floor((p.height||0)/20),9);
    stk.innerHTML = Array.from({length:nb},(_,bi)=>
      `<div class="tblock" style="background:${BLOCK_COLORS[bi%BLOCK_COLORS.length]}"></div>`
    ).join('');

    // lava danger check
    const lavaEl = document.getElementById('lava_'+uid);
    const warn = document.getElementById('warn_'+uid);
    if(lavaEl&&warn){
      const lavaPct = localState.lava||0;
      const tPct = 12+((p.height||0)/700)*78;
      warn.style.display = (tPct-lavaPct)<10?'block':'none';
    }

    // round answer status
    const cst = document.getElementById('cst_'+uid);
    if(cst && localState.phase==='question'){
      const ans = localState.roundAnswers[uid];
      cst.style.display = ans ? 'block' : 'none';
      cst.textContent = ans ? (ans.correct ? '✅':'❌') : '';
    } else if(cst){
      cst.style.display='none';
    }
  });
}

function updateLava(){
  const players = Object.keys(localState.players);
  players.forEach(uid=>{
    const lavaEl = document.getElementById('lava_'+uid);
    if(lavaEl) lavaEl.style.height = (localState.lava||0)+'%';
  });
}

function updateHUD(){
  const hud = document.getElementById('gameHud');
  const pList = Object.entries(localState.players);
  if(pList.length===0) return;

  if(pList.length<=2){
    const [uid0,p0] = pList[0];
    const [uid1,p1] = pList[1]||pList[0];
    const q = localState.qList[localState.qIdx];
    const lvl = q?q.level:1;
    hud.innerHTML=`
      <div class="hud-player">
        <div class="hud-avatar">${CHARS[p0.char||0]}</div>
        <div>
          <div class="hud-name" style="color:${p0.color||COLORS[0]}">${p0.name}${uid0===myId?' ★':''}</div>
          <div class="hud-h">⬆ ${p0.height||0}m</div>
        </div>
      </div>
      <div class="hud-center">${LVL_NAME[lvl]}<br><span style="font-size:.65rem;opacity:.7">${localState.qIdx+1}/30</span></div>
      ${pList.length===2?`
      <div class="hud-player right">
        <div class="hud-avatar">${CHARS[p1.char||0]}</div>
        <div>
          <div class="hud-name" style="color:${p1.color||COLORS[1]}">${p1.name}${uid1===myId?' ★':''}</div>
          <div class="hud-h">⬆ ${p1.height||0}m</div>
        </div>
      </div>`:''}
    `;
  } else {
    const q=localState.qList[localState.qIdx];
    hud.innerHTML=pList.map(([uid,p])=>`
      <div style="flex:1;text-align:center;">
        <div style="font-size:1.1rem">${CHARS[p.char||0]}</div>
        <div style="font-size:.62rem;font-weight:900;color:${p.color}">${p.name}</div>
        <div style="font-size:.58rem;color:#aaa">⬆${p.height||0}m</div>
      </div>
    `).join('') + `<div class="hud-center" style="font-size:.7rem">${q?LVL_NAME[q.level]:'?'}<br><span style="opacity:.6">${localState.qIdx+1}/30</span></div>`;
  }
}

/* ─── QUESTION ───────────────────────────────────────────────────── */
function renderQuestion(){
  const q = localState.qList[localState.qIdx];
  if(!q){ return; }

  const lvl = q.level;
  const lvlClass = lvl===1?'lvl-e':lvl===2?'lvl-m':'lvl-h';
  const lvlLabel = lvl===1?'🟢 Easy':lvl===2?'🟡 Medium':'🔴 Hard';

  const answered = !!localState.roundAnswers[myId];

  const panel = document.getElementById('qpanel');

  if(answered){
    // Show waiting for others
    const totalP = Object.keys(localState.players).length;
    const answeredP = Object.keys(localState.roundAnswers).length;
    panel.innerHTML=`
      <div class="qmeta">
        <span class="qlvl ${lvlClass}">${lvlLabel}</span>
        <span class="qcounter">${localState.qIdx+1}/30</span>
      </div>
      <div class="qtext">${q.q}</div>
      <div class="wait-banner">
        ⏳ Menunggu ${totalP-answeredP} pemain lain...
      </div>
      <div style="text-align:center;margin-top:.5rem;font-size:1.5rem;">
        ${Object.entries(localState.players).map(([uid,p])=>`
          <span title="${p.name}">${CHARS[p.char||0]}${localState.roundAnswers[uid]?(localState.roundAnswers[uid].correct?'✅':'❌'):'⌛'}</span>
        `).join(' ')}
      </div>
    `;
    return;
  }

  panel.innerHTML=`
    <div class="qmeta">
      <span class="qlvl ${lvlClass}">${lvlLabel}</span>
      <span class="qcounter">${localState.qIdx+1}/30</span>
    </div>
    <div class="qtext">${q.q}</div>
    <div class="ans-grid">
      ${q.o.map((opt,oi)=>`
        <button class="abtn" id="ab${oi}" onclick="pickAnswer(${oi})">
          ${'ABCD'[oi]}. ${opt}
        </button>
      `).join('')}
    </div>
  `;
}

async function pickAnswer(idx){
  if(myAnsweredThisRound) return;
  myAnsweredThisRound = true;

  const elapsed = (Date.now() - qStartTime) / 1000;
  const q = localState.qList[localState.qIdx];
  const correct = idx === q.a;
  const lvl = q.level;

  let pts = 0;
  if(correct){
    if(elapsed<=5) pts=PTS[lvl][0];
    else if(elapsed<=15) pts=PTS[lvl][1];
    else pts=PTS[lvl][2];
  }

  // visual feedback immediately
  const btns = document.querySelectorAll('.abtn');
  btns.forEach(b=>b.disabled=true);
  btns[idx].classList.add(correct?'correct':'wrong');
  if(!correct) btns[q.a].classList.add('correct');

  showRpop(
    correct?'✅':'❌',
    correct?`+${pts}m! (${elapsed.toFixed(1)}s)`:'Salah!'  ,
    correct
  );

  // write answer to firebase
  await db.ref('rooms/'+roomId+'/game/roundAnswers/'+myId).set({
    correct, pts, elapsed: Math.round(elapsed*10)/10, idx
  });

  // If host, check if all answered → advance
  if(isHost){
    checkAllAnswered();
  }

  renderQuestion(); // show waiting state
}

async function checkAllAnswered(){
  // poll until all players answered
  let attempts = 0;
  const poll = async () => {
    const [pSnap, aSnap] = await Promise.all([
      db.ref('rooms/'+roomId+'/players').once('value'),
      db.ref('rooms/'+roomId+'/game/roundAnswers').once('value')
    ]);
    const players = pSnap.val()||{};
    const answers = aSnap.val()||{};
    const activePids = Object.entries(players).filter(([,p])=>p.online!==false).map(([uid])=>uid);
    const allAnswered = activePids.every(uid=>answers[uid]);

    if(allAnswered){
      await advanceRound(players, answers);
    } else {
      attempts++;
      if(attempts<120) setTimeout(poll, 1000);
      else await advanceRound(players, answers); // timeout after 2 min
    }
  };
  setTimeout(poll, 500);
}

async function advanceRound(players, answers){
  const q = localState.qList[localState.qIdx];
  const lvl = q.level;

  // update heights
  const updates = {};
  Object.entries(answers).forEach(([uid,ans])=>{
    if(ans.correct && players[uid]){
      const newH = (players[uid].height||0) + ans.pts;
      updates['players/'+uid+'/height'] = newH;
      updates['players/'+uid+'/correct'] = (players[uid].correct||0)+1;
    } else if(players[uid]) {
      updates['players/'+uid+'/wrong'] = (players[uid].wrong||0)+1;
    }
  });

  // lava rises — based on level, regardless of answers
  const newLava = Math.min((localState.lava||0) + LAVA_RISE[lvl], 92);
  const nextIdx = (localState.qIdx||0) + 1;

  updates['game/lava'] = newLava;
  updates['game/roundAnswers'] = null;
  updates['game/qStartTime'] = Date.now();

  if(nextIdx >= 30){
    updates['game/phase'] = 'end';
  } else {
    updates['game/qIdx'] = nextIdx;
    updates['game/phase'] = 'question';
  }

  await db.ref('rooms/'+roomId).update(updates);
}

function renderReveal(){
  // handled inline by renderQuestion showing results
}

function showRpop(em, txt, win){
  const p=document.getElementById('rpop');
  p.className='rpop show '+(win?'win':'lose');
  document.getElementById('rpopEm').textContent=em;
  document.getElementById('rpopTxt').textContent=txt;
  setTimeout(()=>{p.className='rpop';},1300);
}

/* ─── END ────────────────────────────────────────────────────────── */
function showEndScreen(){
  cleanupListeners();
  setScreen('endScreen');
  spawnConfetti();

  const pList = Object.entries(localState.players);
  const sorted = [...pList].sort((a,b)=>(b[1].height||0)-(a[1].height||0));
  const [wUid,wP] = sorted[0];
  const isWinner = wUid === myId;

  document.getElementById('winnerBox').innerHTML=`
    <div class="winner-em">${CHARS[wP.char||0]}</div>
    <div class="winner-lbl">🏆 Pemenang</div>
    <div class="winner-name" style="color:${wP.color}">${wP.name}</div>
    <div style="font-size:.85rem;color:#aaa;margin-top:.3rem">⬆ ${wP.height||0}m</div>
    ${isWinner?'<div style="font-size:.9rem;color:#ffd700;margin-top:.3rem">🎉 Selamat, itu kamu!</div>':''}
  `;

  document.getElementById('statsRow').innerHTML=pList.map(([uid,p])=>`
    <div class="sbox">
      <div>${CHARS[p.char||0]}</div>
      <div class="sbox-lbl" style="color:${p.color}">${p.name}</div>
      <div class="sbox-val">${p.height||0}m</div>
      <div style="font-size:.65rem;color:#666">✅${p.correct||0} ❌${p.wrong||0}</div>
    </div>
  `).join('');

  const maxH = Math.max(...pList.map(([,p])=>p.height||0),1);
  document.getElementById('hbarWrap').innerHTML=`
    <div style="font-size:.7rem;color:#666;text-transform:uppercase;letter-spacing:1px;margin-bottom:.5rem;text-align:center">Ketinggian Tower</div>
    ${sorted.map(([uid,p])=>`
      <div class="hbar-row">
        <span style="font-size:.95rem">${CHARS[p.char||0]}</span>
        <div class="hbar-track">
          <div class="hbar-fill" style="width:${((p.height||0)/maxH*100).toFixed(0)}%;background:${p.color}"></div>
        </div>
        <span class="hbar-num">${p.height||0}m</span>
      </div>
    `).join('')}
  `;
}

function goLobby(){
  cleanupListeners();
  towersBuilt=false;
  localState={players:{},qIdx:0,qList:[],lava:0,phase:'waiting',roundAnswers:{}};
  document.getElementById('waitingCard').style.display='none';
  document.getElementById('roomCard').style.display='block';
  document.getElementById('profileCard').style.display='block';
  setScreen('lobbyScreen');
}

/* ─── UTILS ──────────────────────────────────────────────────────── */
function setScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function spawnConfetti(){
  const colors=['#ffd700','#ff6b6b','#4facfe','#6bcb77','#ff9f43','#ee5a24'];
  for(let i=0;i<50;i++){
    setTimeout(()=>{
      const c=document.createElement('div');
      c.className='cf';
      c.style.cssText=`left:${Math.random()*100}vw;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${2+Math.random()*2}s;transform:rotate(${Math.random()*360}deg)`;
      document.body.appendChild(c);
      setTimeout(()=>c.remove(),4000);
    },i*35);
  }
}
